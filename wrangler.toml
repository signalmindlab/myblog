# Cloudflare Pages configuration for Next.js
# This configuration ensures proper static export for Cloudflare Pages

name = "tailwind-nextjs-blog"
type = "javascript"
compatibility_date = "2026-02-11"

# Build settings for Cloudflare Pages
[build]
# Use EXPORT=1 and UNOPTIMIZED=1 to generate static HTML export
# The build script uses these environment variables to export to 'out' directory
command = "EXPORT=1 UNOPTIMIZED=1 yarn build"

# The 'out' directory contains the static HTML export
# Cloudflare Pages will serve these static files directly
assets = "out"
